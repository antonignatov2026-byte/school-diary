<!doctype html>
<html lang="ru">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Мой дневник</title>
<style>
:root{--ink:#203f64;--blue:#205dcc;--paper:#fff;--line:#c8d5e5;--bg:#e8eef6;--accent:#c84f58}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px 'Trebuchet MS',sans-serif}header{max-width:1300px;margin:auto;padding:32px 24px 20px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{border-left:5px solid var(--accent);padding-left:15px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:2px}h1{font:normal 40px Georgia,serif;margin:4px 0}button{font:inherit;color:var(--ink);border:1px solid var(--line);border-radius:8px;background:white;padding:10px 14px;cursor:pointer}button:hover{background:#eef4ff}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}.toolbar{max-width:1252px;margin:0 auto 20px;display:flex;align-items:center;gap:10px;padding:0 8px}.toolbar strong{flex:1;text-align:center;font-size:16px}.book{max-width:1252px;margin:auto;background:var(--paper);border:1px solid var(--line);box-shadow:0 12px 40px #203f6410;padding:28px;display:grid;grid-template-columns:1fr 1fr;gap:30px;position:relative}.book:before{content:'';position:absolute;left:50%;top:0;bottom:0;border-left:1px solid var(--line)}.page{min-width:0}.month{display:flex;align-items:baseline;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:22px}.month strong{font:italic 24px Georgia,serif;text-transform:capitalize}.month small{font-size:11px;letter-spacing:1px;text-transform:uppercase}.day{margin-bottom:24px}.day-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.day-title h2{font-size:15px;margin:0}.date{font:italic 17px Georgia,serif;color:var(--blue)}table{width:100%;border-collapse:collapse;table-layout:fixed}th,td{border:1px solid var(--line)}th{font-size:10px;font-weight:normal;text-align:left;padding:7px 5px;background:#f3f7fc}th:first-child{width:25px;text-align:center}th:nth-child(2){width:27%}th:nth-child(4){width:46px}th:nth-child(5){width:48px}td:first-child{text-align:center;font-size:11px;color:#6a7c92;background:#f8fafd}td{padding:0;height:34px}td input,textarea{display:block;width:100%;border:0;background:transparent;color:var(--blue);font:13px 'Trebuchet MS',sans-serif;padding:7px 5px;border-radius:0}td textarea{resize:vertical;min-height:34px;height:34px}td input[data-field="grade"]{text-align:center;font-weight:bold}.signatures{border-top:1px solid var(--line);padding-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:15px}.signatures label{font-size:10px}.signatures input{width:100%;border:0;border-bottom:1px solid var(--line);padding:8px 0;color:var(--blue);font:14px 'Trebuchet MS',sans-serif}.note{max-width:1252px;margin:16px auto 30px;padding:0 12px;font-size:12px;line-height:1.7;color:#61738a}.status{font-size:12px;color:#61738a}footer{padding-bottom:10px}@media(max-width:850px){header{padding:24px 16px}h1{font-size:32px}.book{display:block;padding:18px 12px;margin:0 10px}.book:before{display:none}.page+.page{margin-top:30px;border-top:3px double var(--line);padding-top:22px}.toolbar{margin:0 10px 16px;flex-wrap:wrap}.toolbar strong{font-size:13px}.toolbar button{padding:9px 10px}.eyebrow{font-size:10px}header>button{font-size:12px}.month strong{font-size:22px}th{font-size:9px}td input,td textarea{font-size:12px;padding:7px 3px}.status{display:none}}@media print{body{background:white}header>button,.toolbar,.note{display:none}header{padding:8px}h1{font-size:24px}.book{box-shadow:none;border:0;padding:10px;gap:20px}.day{break-inside:avoid}td{height:30px}.book:before{display:none}}
</style>
<header><div class="brand"><span class="eyebrow">Школьная неделя · первый вариант</span><h1>Мой дневник</h1></div><button id="today">Текущая неделя</button></header>
<nav class="toolbar" aria-label="Выбор недели"><button id="prev" aria-label="Предыдущая неделя">←</button><strong id="range"></strong><button id="next" aria-label="Следующая неделя">→</button><span class="status" id="status" role="status">Расписание на неделю заполнено</span></nav>
<main class="book" id="book"></main>
<footer class="note">Нажми на ячейку, чтобы заполнить дневник. Записи сохраняются только в этом браузере, без отправки в интернет. Это личный дневник, не официальный школьный журнал. Поля подписей — текстовые пометки, не электронные подписи.</footer>
<script>
'use strict';
const days=['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
const defaultSchedule=[['Разговоры о важном','География','Биология','Труд','Геометрия','ОБЗР'],['','История','Русский язык','Иностранный язык','Музыка','Алгебра'],['Химия','Физкультура','Геометрия','Русский язык','История','Иностранный язык'],['Алгебра','Физкультура','История','Физика','Русский язык','Литература','Профориентация'],['География','Иностранный язык','Биология','Черчение','Химия','Вероятность и статистика'],['Информатика','Физика','Алгебра','Литература']];
const key='personal-school-diary-v1';
let data={};let storageAvailable=true;
try{data=JSON.parse(localStorage.getItem(key)||'{}');if(!data||typeof data!=='object'||Array.isArray(data))data={}}catch{storageAvailable=false}
let monday=new Date();monday.setHours(12,0,0,0);monday.setDate(monday.getDate()-(monday.getDay()+6)%7);
const original=new Date(monday);
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const dayAt=n=>{const d=new Date(monday);d.setDate(d.getDate()+n);return d};
const fmt=d=>d.toLocaleDateString('ru-RU',{day:'numeric',month:'long'});
function input(field,label,multiline=false){const e=document.createElement(multiline?'textarea':'input');e.dataset.field=field;e.setAttribute('aria-label',label);if(!multiline)e.type='text';e.autocomplete='off';return e}
function restore(e,id){e.dataset.id=id;const [date,lesson,field]=id.split(':');const weekday=(new Date(date+'T12:00:00').getDay()+6)%7;const fallback=field==='subject'?(defaultSchedule[weekday]?.[Number(lesson)-1]||''):'';e.value=typeof data[id]==='string'?data[id]:fallback;return e}
function render(){
 const book=document.getElementById('book');book.replaceChildren();document.getElementById('range').textContent=fmt(monday)+' — '+fmt(dayAt(5))+' · '+dayAt(5).getFullYear();
 for(let page=0;page<2;page++){
  const section=document.createElement('section');section.className='page';
  const top=document.createElement('div');top.className='month';const label=document.createElement('small');label.textContent='Месяц';const month=document.createElement('strong');month.textContent=dayAt(page*3).toLocaleDateString('ru-RU',{month:'long'});top.append(label,month);section.append(top);
  for(let i=page*3;i<page*3+3;i++){
   const date=dayAt(i),day=document.createElement('section');day.className='day';
   const heading=document.createElement('div');heading.className='day-title';const title=document.createElement('h2');title.textContent=days[i];const stamp=document.createElement('span');stamp.className='date';stamp.textContent=date.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'});heading.append(title,stamp);day.append(heading);
   const table=document.createElement('table');table.setAttribute('aria-label',days[i]);const head=document.createElement('thead');head.innerHTML='<tr><th scope="col">№</th><th scope="col">Предмет</th><th scope="col">Домашнее задание</th><th scope="col">Оценка</th><th scope="col">Подпись учителя</th></tr>';table.append(head);const body=document.createElement('tbody');
   for(let n=1;n<=8;n++){const row=document.createElement('tr');const num=document.createElement('td');num.textContent=n;row.append(num);for(const [field,name] of [['subject','Предмет'],['homework','Домашнее задание'],['grade','Оценка'],['signature','Подпись учителя']]){const cell=document.createElement('td');cell.append(restore(input(field,`${days[i]}, урок ${n}: ${name}`,field==='homework'),`${iso(date)}:${n}:${field}`));row.append(cell)}body.append(row)}table.append(body);day.append(table);section.append(day)
  }
  const bottom=document.createElement('div');bottom.className='signatures';for(const name of page===0?['Для заметок']:['Подпись классного руководителя','Подпись родителей']){const label=document.createElement('label');label.textContent=name;label.append(restore(input('note',name),`${iso(monday)}:${name}`));bottom.append(label)}section.append(bottom);book.append(section)
 }
}
document.getElementById('book').addEventListener('input',event=>{const e=event.target;if(!e.dataset.id)return;data[e.dataset.id]=e.value;const status=document.getElementById('status');try{localStorage.setItem(key,JSON.stringify(data));status.textContent='Сохранено в этом браузере'}catch{storageAvailable=false;status.textContent='Не сохранено';document.querySelector('.note').textContent='Браузер не разрешил сохранение. Записи останутся только до закрытия страницы. Открой файл во внешнем браузере.'}});
document.getElementById('prev').onclick=()=>{monday.setDate(monday.getDate()-7);render()};document.getElementById('next').onclick=()=>{monday.setDate(monday.getDate()+7);render()};document.getElementById('today').onclick=()=>{monday=new Date(original);render()};render();
if(!storageAvailable)document.querySelector('.note').textContent='Сохранение в этом браузере недоступно. Открой файл во внешнем браузере. Пока записи останутся только до закрытия страницы.';
</script>
</html>
